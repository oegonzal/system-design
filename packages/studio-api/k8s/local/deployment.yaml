apiVersion: apps/v1
kind: Deployment
metadata:
  name: studio-api
  labels:
    app: studio-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: studio-api
  template:
    metadata:
      labels:
        app: studio-api
    spec:
      containers:
        - name: studio-api
          image: studio-api
          ports:
            - containerPort: 3000
          # Everything else is a code default: the stores are on the host, and
          # the grader is the loop's Service rather than localhost.
          envFrom:
            - configMapRef:
                name: local-stores
          env:
            - name: QUALITY_LOOP_URL
              value: http://quality-loop-service:3003
---
apiVersion: v1
kind: Service
metadata:
  name: studio-api-service
spec:
  selector:
    app: studio-api
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
  # In-cluster only: the host reaches it through Tilt's port-forward. A
  # LoadBalancer here makes Docker Desktop's Kubernetes publish 0.0.0.0:3000
  # too, and the two race for the port.
  type: ClusterIP

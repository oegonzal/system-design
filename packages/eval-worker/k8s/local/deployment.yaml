apiVersion: apps/v1
kind: Deployment
metadata:
  name: eval-worker
  labels:
    app: eval-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eval-worker
  template:
    metadata:
      labels:
        app: eval-worker
    spec:
      containers:
        - name: eval-worker
          image: eval-worker
          ports:
            - containerPort: 3002
          env:
            - name: DB_HOST
              value: sysdesign-postgres-service
            - name: DB_PORT
              value: '5432'
            - name: DB_USERNAME
              value: admin
            - name: DB_PASSWORD
              value: admin
            - name: DB_NAME
              value: sysdesign
            - name: WORKER_PORT
              value: '3002'
# No Service on purpose: nothing calls the worker — its interface is the
# eval_job table. Tilt port-forwards 3002 straight to the pod for /health.

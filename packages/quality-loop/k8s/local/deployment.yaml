apiVersion: apps/v1
kind: Deployment
metadata:
  name: quality-loop
  labels:
    app: quality-loop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quality-loop
  template:
    metadata:
      labels:
        app: quality-loop
    spec:
      containers:
        - name: quality-loop
          image: quality-loop
          ports:
            - containerPort: 3003
          env:
            - name: DB_HOST
              value: sysdesign-postgres-service
            - name: DB_PORT
              value: '5432'
            - name: DB_USERNAME
              value: admin
            - name: DB_PASSWORD
              value: admin
            - name: DB_NAME
              value: sysdesign
            - name: QUALITY_LOOP_PORT
              value: '3003'
            - name: QUALITY_LOOP_CORS_ORIGIN
              value: http://localhost:4201
            # The loop boots only with a model, and a pod has no Claude Code
            # login, so the key comes from the Secret the Tiltfile builds from
            # the shell's ANTHROPIC_API_KEY. With it empty the pod exits 1 with
            # the loop's own message naming the variable.
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: quality-loop-model
                  key: ANTHROPIC_API_KEY
            - name: LLM_MODEL
              valueFrom:
                secretKeyRef:
                  name: quality-loop-model
                  key: LLM_MODEL
                  optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: quality-loop-service
spec:
  selector:
    app: quality-loop
  ports:
    - protocol: TCP
      port: 3003
      targetPort: 3003
  type: LoadBalancer

apiVersion: apps/v1
kind: Deployment
metadata:
  name: quality-loop
  labels:
    app: quality-loop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quality-loop
  template:
    metadata:
      labels:
        app: quality-loop
    spec:
      containers:
        - name: quality-loop
          image: quality-loop
          ports:
            - containerPort: 3003
          # Everything else is a code default. The stores are on the host; the
          # model settings come from the Secret the Tiltfile builds. The loop
          # runs only on a Claude Code subscription login, and a pod has no
          # `claude login`, so it signs in with the CLAUDE_CODE_OAUTH_TOKEN
          # that `claude setup-token` prints; without it the pod exits at boot
          # with the loop's own message.
          envFrom:
            - configMapRef:
                name: local-stores
            - secretRef:
                name: quality-loop-model
          # The dump directory's default, `<cwd>/static/runs`, on a volume so
          # the dumps outlive the pod.
          volumeMounts:
            - name: runs
              mountPath: /app/static/runs
      volumes:
        - name: runs
          persistentVolumeClaim:
            claimName: quality-loop-runs
---
apiVersion: v1
kind: Service
metadata:
  name: quality-loop-service
spec:
  selector:
    app: quality-loop
  ports:
    - protocol: TCP
      port: 3003
      targetPort: 3003
  # In-cluster only: the host reaches it through Tilt's port-forward. A
  # LoadBalancer here makes Docker Desktop's Kubernetes publish 0.0.0.0:3003
  # too, and the two race for the port.
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: quality-loop-runs
  annotations:
    # `tilt down` keeps the dumps, as it keeps the stores.
    tilt.dev/down-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi

apiVersion: apps/v1
kind: Deployment
metadata:
  name: quality-loop
  labels:
    app: quality-loop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quality-loop
  template:
    metadata:
      labels:
        app: quality-loop
    spec:
      containers:
        - name: quality-loop
          image: quality-loop
          ports:
            - containerPort: 3003
          env:
            - name: DB_HOST
              value: sysdesign-postgres-service
            - name: DB_PORT
              value: '5432'
            - name: DB_USERNAME
              value: admin
            - name: DB_PASSWORD
              value: admin
            - name: DB_NAME
              value: sysdesign
            - name: QUALITY_LOOP_PORT
              value: '3003'
            - name: QUALITY_LOOP_CORS_ORIGIN
              value: http://localhost:4201
            # The loop runs only on a Claude Code subscription login. A pod has
            # no `claude login`, so it signs in with the long-lived token that
            # `claude setup-token` prints, from the Secret the Tiltfile builds.
            # Without it the pod exits at boot with the loop's own message.
            - name: CLAUDE_CODE_OAUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: quality-loop-model
                  key: CLAUDE_CODE_OAUTH_TOKEN
            - name: LLM_MODEL
              valueFrom:
                secretKeyRef:
                  name: quality-loop-model
                  key: LLM_MODEL
                  optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: quality-loop-service
spec:
  selector:
    app: quality-loop
  ports:
    - protocol: TCP
      port: 3003
      targetPort: 3003
  # In-cluster only: the host reaches it through Tilt's port-forward. A
  # LoadBalancer here makes Docker Desktop's Kubernetes publish 0.0.0.0:3003
  # too, and the two race for the port.
  type: ClusterIP

apiVersion: apps/v1
kind: Deployment
metadata:
  name: gmail
  labels:
    app: gmail
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gmail
  template:
    metadata:
      labels:
        app: gmail
    spec:
      containers:
        - name: gmail
          image: gmail
          ports:
            - containerPort: 3008
          # The loop, the bus and the calendar by their in-cluster Services: the
          # localhost fallbacks would reach nothing inside the pod. Everything
          # else is the package's own config/ files; the Google credentials come
          # from the google-oauth secret.
          env:
            - name: QUALITY_LOOP_URL
              value: http://quality-loop-service:3003
            - name: NOTIFICATIONS_URL
              value: http://notifications-service:3005
            - name: GOOGLE_CALENDAR_URL
              value: http://google-calendar-service:3009
          envFrom:
            - secretRef:
                name: google-oauth
---
apiVersion: v1
kind: Service
metadata:
  name: gmail-service
spec:
  selector:
    app: gmail
  ports:
    - protocol: TCP
      port: 3008
      targetPort: 3008
  # In-cluster only: the host reaches it through Tilt's port-forward.
  type: ClusterIP

# Canonical local-dev database for System Design Studio.
#
# Durable and self-restarting, so practice runs (sessions, designs, evaluations)
# survive a shutdown or reboot and come back with `pnpm stack:up` or `tilt up`,
# which both start these same services:
#   - a NAMED volume (`sysdesign-pgdata`) keeps the data on disk, reproducibly
#     from this repo — unlike an ad-hoc container's anonymous volume;
#   - `restart: unless-stopped` brings the server back after a Docker/machine
#     restart without anyone having to `docker start` it.
#
# Port 5433, the credentials and the db name are the app's connection defaults
# (`packages/db/src/connection.ts`); 5433 also avoids a stale :5432 on this machine.
#
# `vectors` is the quality loop's memory store (Qdrant): the same named-volume
# and restart rules apply, it is started and stopped together with `db` by
# `scripts/stack.sh`, and the app reaches it at `QDRANT_URL` (default :6333).
# The image ships no shell tools, so readiness is gated from the host
# (`stack.sh` waits on `/readyz`) rather than by a compose healthcheck.
services:
  db:
    image: postgres:16-alpine
    container_name: sysdesign-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: sysdesign
    ports:
      - '5433:5432'
    volumes:
      - sysdesign-pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U admin -d sysdesign']
      interval: 5s
      timeout: 5s
      retries: 20

  vectors:
    image: qdrant/qdrant:v1.19.1
    container_name: sysdesign-vectors
    environment:
      QDRANT__TELEMETRY_DISABLED: 'true'
    ports:
      - '127.0.0.1:6333:6333'
    volumes:
      - sysdesign-qdrant:/qdrant/storage
    restart: unless-stopped

volumes:
  sysdesign-pgdata:
  sysdesign-qdrant:

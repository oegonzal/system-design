name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: sysdesign
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d sysdesign"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_USERNAME: admin
      DB_PASSWORD: admin
      # The test database, not the service's own: every suite truncates, and
      # every truncating path refuses a database that is not a test one
      # (packages/db/src/testing/test-database.ts). `db:migrate` and the
      # harnesses create it on the service's server.
      DB_NAME: sysdesign_test
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Seed reference data
        run: pnpm db:seed

      - name: Schema drift gate (entities vs migrations)
        run: pnpm db:migrate:check

      - name: Formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm exec nx run-many -t lint --all

      - name: Typecheck
        run: pnpm exec nx run-many -t typecheck --all

      - name: Typecheck tooling
        run: pnpm typecheck:tooling

      - name: Lint tooling
        run: pnpm lint:tooling

      - name: Test tooling
        run: pnpm test:tooling

      - name: Test
        # Serial on purpose: the studio-api and quality-loop integration suites
        # share the one Postgres service and truncate between tests.
        run: pnpm exec nx run-many -t test --all --parallel=1

      - name: Build
        run: pnpm exec nx run-many -t build build-storybook --all

      - name: Install Playwright chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Storybook smoke
        run: pnpm test:stories

      - name: End-to-end
        run: pnpm exec nx run studio-e2e:e2e --args="--project=chromium --project=narrow --project=grader-down"

      - name: End-to-end, website
        # The built site under wrangler dev: Cloudflare's routing, 404 page and headers.
        run: pnpm exec nx run website-e2e:e2e

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            dist/.playwright/packages/studio-e2e/playwright-report
            dist/.playwright/packages/studio-e2e/test-output
            dist/.playwright/packages/website-e2e/playwright-report
            dist/.playwright/packages/website-e2e/test-output
          retention-days: 7
          if-no-files-found: ignore

  image-matrix:
    # The image matrix, from the one declaration of what is deployed
    # (infra/aws/apps.json) through the one script the deploy workflow derives
    # its matrix with, so CI and the deploy build the same images the same way
    # and neither names an image (tooling/aws-deploy.spec.ts holds both to it).
    # CI alone adds the declaration's local-only Nest apps, the ones that run on
    # the laptop and never deploy: the bare-checkout guard covers every app.
    name: Image matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      images: ${{ steps.matrix.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Derive the image matrix from infra/aws/apps.json
        id: matrix
        run: echo "images=$(node infra/aws/bin/image-matrix.js --with-local-only)" >> "$GITHUB_OUTPUT"

  images:
    # Regression guard for the "builds from a bare checkout" guarantee: no
    # host-side dist/, no lockfile drift, every image — deployed or local-only —
    # always constructible. Built for the runner's own platform and never
    # pushed; the deploy workflow builds the ARM images it ships with the same
    # matrix entry.
    name: Docker image ${{ matrix.image }}
    needs: image-matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.image-matrix.outputs.images) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          build-args: ${{ matrix.build_args }}
          provenance: false
          push: false

  infra:
    # The CloudFormation templates, linted and held to the repository's guard
    # rules before any of them can deploy: what `pnpm aws:lint` runs, with both
    # tools pinned (docs/aws/deployment.md).
    name: Infrastructure templates
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      CFN_LINT_VERSION: 1.46.0
      CFN_GUARD_VERSION: 3.2.1
      # sha256 of release 3.2.1's cfn-guard-v3-x86_64-ubuntu-latest.tar.gz, read 2026-11-11.
      CFN_GUARD_SHA256: 09c2b8cfd81d513374a8da89d4805dc55006a3da52bbf598e272022d4d198e94
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install cfn-lint
        run: python -m pip install --disable-pip-version-check "cfn-lint==$CFN_LINT_VERSION"

      # The release binary, by version and checksum: the official GitHub action
      # still runs on node20, which the runners dropped on 2026-09-23.
      - name: Install cfn-guard
        run: |
          archive="$RUNNER_TEMP/cfn-guard.tar.gz"
          curl --fail --silent --show-error --location --output "$archive" \
            "https://github.com/aws-cloudformation/cloudformation-guard/releases/download/$CFN_GUARD_VERSION/cfn-guard-v3-x86_64-ubuntu-latest.tar.gz"
          echo "$CFN_GUARD_SHA256  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/cfn-guard-v3-x86_64-ubuntu-latest" >> "$GITHUB_PATH"

      - name: Lint the templates
        run: cfn-lint infra/aws/*.yaml

      - name: Hold the templates to the guard rules
        run: |
          for template in infra/aws/*.yaml; do
            cfn-guard validate --rules infra/aws/guard/sysdesign.guard --data "$template" --show-summary fail
          done

  review:
    name: Code review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run review
        env:
          # The critics run on the Claude Code subscription, never an API key:
          # the long-lived token `claude setup-token` prints, stored as a
          # repository secret. A fork PR has no secrets, so its critics are
          # skipped and the deterministic rules decide alone. Every variable
          # here is declared in tooling/code-review/config.ts.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Through env, never interpolated into the script: PR title/body are
          # attacker-controlled on fork PRs.
          REVIEW_INTENT: |
            ${{ github.event.pull_request.title }}

            ${{ github.event.pull_request.body }}
        run: pnpm review:code --base=origin/${{ github.base_ref }} --markdown=review.md

      - name: Upload review record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-review-runs
          path: .code-review/runs
          retention-days: 90
          if-no-files-found: ignore

      - name: Post sticky PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- code-review -->';
            let body;
            try {
              body = marker + '\n' + fs.readFileSync('review.md', 'utf8');
            } catch {
              body = marker + '\nCode review produced no report (see the workflow logs).';
            }

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(
              (c) => c.user?.type === 'Bot' && c.body?.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

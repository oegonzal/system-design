name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: sysdesign
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d sysdesign"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      qdrant:
        image: qdrant/qdrant:v1.19.1
        env:
          QDRANT__TELEMETRY_DISABLED: 'true'
        ports:
          - 6333:6333

    env:
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_USERNAME: admin
      DB_PASSWORD: admin
      DB_NAME: sysdesign
      QDRANT_URL: http://localhost:6333
      # Evaluations must be byte-reproducible in CI even if a key is configured.
      EVAL_DETERMINISTIC: '1'
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Seed reference data
        run: pnpm db:seed

      - name: Schema drift gate (entities vs migrations)
        run: pnpm db:migrate:check

      - name: Formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm exec nx run-many -t lint --all

      - name: Typecheck
        run: pnpm exec nx run-many -t typecheck --all

      - name: Typecheck tooling
        run: pnpm typecheck:tooling

      - name: Test tooling
        run: pnpm test:tooling

      - name: Test
        # Serial on purpose: studio-api and eval-worker integration suites
        # share the one Postgres service and truncate between tests.
        run: pnpm exec nx run-many -t test --all --parallel=1

      - name: Build
        run: pnpm exec nx run-many -t build build-storybook --all

      - name: Install Playwright chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Storybook smoke
        run: pnpm test:stories

      - name: End-to-end
        run: pnpm exec nx run studio-e2e:e2e --args="--project=chromium"

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            packages/studio-e2e/playwright-report
            packages/studio-e2e/test-output
          retention-days: 7
          if-no-files-found: ignore

  images:
    # Regression guard for the "builds from a bare checkout" guarantee: no
    # host-side dist/, no lockfile drift, both images always constructible.
    name: Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        app: [studio-api, eval-worker]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.app }}
        run: docker build -f docker/nest-app.Dockerfile --build-arg APP=${{ matrix.app }} -t ${{ matrix.app }}:ci .

  review:
    name: Code review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check review credentials
        id: creds
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANTHROPIC_API_KEY is not available (fork PR or unset secret) — running deterministic rules only."
          fi

      - name: Install Claude Code
        if: steps.creds.outputs.available == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Run review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Through env, never interpolated into the script: PR title/body are
          # attacker-controlled on fork PRs.
          REVIEW_INTENT: |
            ${{ github.event.pull_request.title }}

            ${{ github.event.pull_request.body }}
        run: pnpm review:code --base=origin/${{ github.base_ref }} --profile=full --markdown=review.md

      - name: Upload review record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-review-runs
          path: .code-review/runs
          retention-days: 90
          if-no-files-found: ignore

      - name: Post sticky PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- code-review -->';
            let body;
            try {
              body = marker + '\n' + fs.readFileSync('review.md', 'utf8');
            } catch {
              body = marker + '\nCode review produced no report (see the workflow logs).';
            }

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(
              (c) => c.user?.type === 'Bot' && c.body?.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

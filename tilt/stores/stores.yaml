# Where a pod reaches the store: the docker-compose Postgres on the host,
# through Docker Desktop's host.docker.internal. Only the host differs from a
# process on this machine; the DB port, user, password and name are the code
# defaults (packages/db/src/connection.ts). The memories recalled by meaning
# are pgvector tables in that same database, so there is no second address.
apiVersion: v1
kind: ConfigMap
metadata:
  name: local-stores
data:
  DB_HOST: host.docker.internal

apiVersion: apps/v1
kind: Deployment
metadata:
  name: sysdesign-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sysdesign-postgres
  template:
    metadata:
      labels:
        app: sysdesign-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - 'pg_isready -U admin -d sysdesign'
            initialDelaySeconds: 5
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 5
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: 'admin'
            - name: POSTGRES_PASSWORD
              value: 'admin'
            - name: POSTGRES_DB
              value: 'sysdesign'
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: postgres-storage
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: sysdesign-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: sysdesign-postgres-service
spec:
  selector:
    app: sysdesign-postgres
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sysdesign-postgres-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi

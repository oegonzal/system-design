packages:
  # all packages in direct subdirs of packages/
  - 'packages/*'
# `true` runs a dependency's install script; `false` skips it on purpose.
# core-js's postinstall only prints a funding banner.
allowBuilds:
  '@nestjs/core': true
  '@parcel/watcher': true
  '@swc/core': true
  core-js: false
  esbuild: true
  nx: true
  sharp: true
  unrs-resolver: true
  # wrangler resolves workerd's binary from its platform package at run time; the
  # postinstall only re-links and version-checks it. Skipping it keeps install-time
  # code out, and the Alpine image builds never execute the glibc-only binary.
  workerd: false
peerDependencyRules:
  allowedVersions:
    typescript: '6'
    eslint: '10'
